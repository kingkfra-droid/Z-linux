services:
  api:
    image: node:22-slim
    restart: on-failure
    working_dir: /workspace/api
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
    command: ["sh", "-ec", "npm install && exec node --watch server.js"]
    environment:
      - PORT=8000
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: node:22-slim
    restart: on-failure
    working_dir: /workspace/web
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 3000"]
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
