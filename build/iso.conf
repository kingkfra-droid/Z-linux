# ISO build configuration for Z-Linux
# Basic variables used by build/mkiso.sh

ISO_LABEL="Z-Linux"
ISO_NAME="z-linux.iso"
OUT_DIR="build/out"
SOURCE_DIR="livefs"  # directory containing tree to be turned into an ISO
VOLUME_ID="ZLINUX"

# Paths for optional kernel/initramfs (if you want to include custom kernel)
KERNEL_IMAGE="/boot/vmlinuz"
INITRD_IMAGE="/boot/initrd.img"
